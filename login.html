<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registraion Form</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                url("bg.jpg");
            background-size: cover;      
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            font-family: Arial, sans-serif;
            
        }
        .login-box{
            position:relative;
            width:350px;
            padding:35px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.25);
            border-radius:20px;
            box-shadow:0 10px 40px rgba(0,0,0,0.35);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            outline:none;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            border:none;
            border-radius: 10px;
            background: #ff9800;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-box button:hover {
            background: #e68900;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: white;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px); 
        }

        .close-btn:hover {
            color: red;
        }
        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <span class="close-btn" onclick="closeLogin()">&times;</span>
    <h2>Login</h2>
    
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
   

    <button onclick="login()">Login</button>

    <div class="message" id="message"></div>
</div>

</body>
</html>
