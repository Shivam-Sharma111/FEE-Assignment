<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }
        body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;

        background-image: url("bg.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

        .todo{
            width:400px;
            min-height:450px;
            background:#fff;
            padding:20px;
            border-radius:12px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .top{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:10px;
            border:1px solid #ccc;
            border-radius:6px;
            outline:none;
            font-size:16px;
        }

        input:focus{
            border-color:#2563eb;
        }

        .add-btn{
            background:blueviolet;
            color:white;
            border:none;
            padding:10px 16px;
            border-radius:6px;
            cursor:pointer;
        }

        .add-btn:hover{
            background:#1d4ed8;
        }

        .list{
            margin-top:20px;
        }

        .item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px;
            background:#f8fafc;
            border-radius:8px;
            margin-bottom:10px;
        }

        .item p{
            font-size:16px;
            color:#333;
            word-break:break-word;
        }

        .delete-btn{
            background:#ef4444;
            color:white;
            border:none;
            padding:8px 12px;
            border-radius:6px;
            cursor:pointer;
        }

        .delete-btn:hover{
            background:#dc2626;
        }
    </style>
</head>

<body>

<div class="todo">
    <h1>📝 Todo App</h1>
</div>

<script src="tod.js"></script>

</body>
</html>
