<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#202124;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            overflow:hidden;
        }

        .card{
            background:white;
            width:420px;
            padding:30px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        h1{
            margin-bottom:15px;
        }

        p{
            font-size:20px;
            margin-bottom:35px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:20px;
        }

        button{
            padding:12px 28px;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:0.2s;
        }

        #yes{
            background:#28a745;
            color:white;
        }

        #yes:hover{
            transform:scale(1.08);
        }

        #no{
            background:#dc3545;
            color:white;
            position:relative;
        }

        #message{
            margin-top:30px;
            font-size:22px;
            font-weight:bold;
            color:#28a745;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>My Meme!</h1>
    <p>Does my meme look good?</p>
    <div class="buttons">
        <button id="yes">YES</button>
        <button id="no">NO</button>
    </div>
    <div id="message"></div>
</div>
<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const msg = document.getElementById("message");
noBtn.addEventListener("mouseenter", () => {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;
    noBtn.style.position = "fixed";
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
});
yesBtn.addEventListener("click", () => {
    msg.innerHTML = "Thanks!";
});
</script>
</body>
</html>
